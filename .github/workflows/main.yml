jobs:
      build:
        runs-on: ubuntu-latest
        steps:
          - name: Checkout code
            uses: actions/checkout@v4

          - name: Set up Java
            uses: actions/setup-java@v4
            with:
              distribution: 'zulu'
              java-version: '17'

          - name: Set up Flutter
            uses: subosito/flutter-action@v2
            with:
              channel: 'stable'

          - name: Wipe legacy Android folder and rebuild
            run: |
              rm -rf android/
              flutter create . --platforms=android

          - name: Inject Kotlin DSL Config (TFLite & MinSDK 24)
            run: |
              python -c '
              import os
              file = "android/app/build.gradle.kts"
              if os.path.exists(file):
                  with open(file, "r") as f: data = f.read()
                  data = data.replace("flutter.minSdkVersion", "24")
                  data = data.replace("defaultConfig {", "androidResources { noCompress += \"tflite\"; noCompress += \"json\" }\n\n    defaultConfig {")
                  with open(file, "w") as f: f.write(data)
              '

          - name: Install dependencies
            run: flutter pub get

          - name: Build APK
            run: flutter build apk --release

          - name: Upload APK
            uses: actions/upload-artifact@v4
            with:
              name: farm-crop-ai-apk
              path: build/app/outputs/flutter-apk/app-release.apk
