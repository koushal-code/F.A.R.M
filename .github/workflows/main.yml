jobs:
      build:
        runs-on: ubuntu-latest
        steps:
          - name: Checkout code
            uses: actions/checkout@v4

          - name: Set up Java
            uses: actions/setup-java@v4
            with:
              distribution: 'zulu'
              java-version: '17'

          - name: Set up Flutter
            uses: subosito/flutter-action@v2
            with:
              channel: 'stable'

          - name: Scaffold missing Android architecture
            run: flutter create . --platforms=android

          - name: Prevent TFLite model compression
            run: |
              echo "" >> android/app/build.gradle
              echo "android {" >> android/app/build.gradle
              echo "    aaptOptions {" >> android/app/build.gradle
              echo "        noCompress 'tflite', 'json'" >> android/app/build.gradle
              echo "    }" >> android/app/build.gradle
              echo "}" >> android/app/build.gradle

          - name: Install dependencies
            run: flutter pub get

          - name: Build APK
            run: flutter build apk --release

          - name: Upload APK
            uses: actions/upload-artifact@v4
            with:
              name: farm-crop-ai-apk
              path: build/app/outputs/flutter-apk/app-release.apk
