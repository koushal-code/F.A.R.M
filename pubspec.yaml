name: farm_crop_ai
description: FARM - Precision Agricultural Crop Disease & Pest Diagnostic AI
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  image_picker: ^1.0.7
  flutter_tts: ^4.0.2
  shared_preferences: ^2.2.2
  provider: ^6.1.1
  # Local ML and DB packages:
  tflite_flutter: ^0.10.4
  image: ^4.1.7 
  sqflite: ^2.3.0
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/mobilenetv2_disease.tflite
    - assets/class_names.json
    - assets/plant_disease_model.tflite
    - assets/labels.json
