    <script>
      // Prevent Vite HMR WebSocket connection failure in Cloud Run preview environment
      (function() {
        if (typeof window !== 'undefined' && window.WebSocket) {
          var NativeWebSocket = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            if (protocols === 'vite-hmr' || (typeof url === 'string' && (url.indexOf(':24678') !== -1 || url.indexOf('token=') !== -1))) {
              var mock = {
                readyState: 1,
                OPEN: 1,
                CONNECTING: 0,
                CLOSING: 2,
                CLOSED: 3,
                send: function() {},
                close: function() {},
                addEventListener: function(type, listener) {
                  if (type === 'open' && typeof listener === 'function') {
                    setTimeout(listener, 0);
                  }
                },
                removeEventListener: function() {},
                dispatchEvent: function() { return true; }
              };
              return mock;
            }
            return new NativeWebSocket(url, protocols);
          };
          window.WebSocket.prototype = NativeWebSocket.prototype;
          window.WebSocket.OPEN = NativeWebSocket.OPEN;
          window.WebSocket.CONNECTING = NativeWebSocket.CONNECTING;
          window.WebSocket.CLOSING = NativeWebSocket.CLOSING;
          window.WebSocket.CLOSED = NativeWebSocket.CLOSED;
        }

        function isViteWsError(err) {
          if (!err) return false;
          var str = String(err.message || err.stack || err || '');
          return str.indexOf('WebSocket') !== -1 || 
                 str.indexOf('ModuleRunnerTransport') !== -1 || 
                 str.indexOf('createWebSocketModuleRunnerTransport') !== -1 ||
                 str.indexOf('vite') !== -1;
        }

        window.addEventListener('unhandledrejection', function(event) {
          if (isViteWsError(event && event.reason)) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);

        window.addEventListener('error', function(event) {
          if (isViteWsError(event && (event.error || event.message))) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
